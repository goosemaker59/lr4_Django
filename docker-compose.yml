version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: lr4_postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lr4_db}
      POSTGRES_USER: ${POSTGRES_USER:-lr4_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lr4_password}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lr4_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: lr4_web
    command: python lr4/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DEBUG=${DEBUG:-True}
      - POSTGRES_DB=${POSTGRES_DB:-lr4_db}
      - POSTGRES_USER=${POSTGRES_USER:-lr4_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-lr4_password}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432

volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

